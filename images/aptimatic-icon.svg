<svg viewBox="0 0 32 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ig" x1="16" y1="2" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <!-- Left leg: apex → crossbar-left → bottom-left (crossbar node at exact midpoint) -->
  <line x1="16" y1="2"  x2="2"  y2="28" stroke="url(#ig)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Right leg: apex → crossbar-right → bottom-right -->
  <line x1="16" y1="2"  x2="30" y2="28" stroke="url(#ig)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Crossbar at exact midpoint of both legs (y=15, x=9 left, x=23 right) -->
  <line x1="9"  y1="15" x2="23" y2="15" stroke="url(#ig)" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="16" cy="2"  r="2.8" fill="url(#ig)"/>
  <circle cx="2"  cy="28" r="2.8" fill="url(#ig)"/>
  <circle cx="30" cy="28" r="2.8" fill="url(#ig)"/>
  <circle cx="9"  cy="15" r="2.8" fill="url(#ig)"/>
  <circle cx="23" cy="15" r="2.8" fill="url(#ig)"/>
</svg>
