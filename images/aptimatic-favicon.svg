  <!-- Nodes -->
  <circle cx="16"  cy="3"  r="2.5" fill="url(#fg)"/>
  <circle cx="3"   cy="29" r="2.5" fill="url(#fg)"/>
  <circle cx="29"  cy="29" r="2.5" fill="url(#fg)"/>
