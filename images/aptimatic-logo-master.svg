<svg viewBox="0 0 204 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mlg" x1="20" y1="2" x2="20" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#60A5FA"/>
      <stop offset="55%"  stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
    </style>
  </defs>

  <!-- ── Icon: circuit A, crossbar at 55% of leg length ── -->
  <line x1="20"   y1="2"  x2="3"    y2="38" stroke="url(#mlg)" stroke-width="3"   stroke-linecap="round"/>
  <line x1="20"   y1="2"  x2="37"   y2="38" stroke="url(#mlg)" stroke-width="3"   stroke-linecap="round"/>
  <line x1="10.5" y1="22" x2="29.5" y2="22" stroke="url(#mlg)" stroke-width="3"   stroke-linecap="round"/>
  <circle cx="20"   cy="2"  r="3.2" fill="url(#mlg)"/>
  <circle cx="3"    cy="38" r="3.2" fill="url(#mlg)"/>
  <circle cx="37"   cy="38" r="3.2" fill="url(#mlg)"/>
  <circle cx="10.5" cy="22" r="3.2" fill="url(#mlg)"/>
  <circle cx="29.5" cy="22" r="3.2" fill="url(#mlg)"/>

  <!-- ── Wordmark: white bold, cyan italic "i" ── -->
  <text x="52" y="30"
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="27"
        font-weight="800"
        letter-spacing="-0.7"
        fill="white">Aptimat<tspan fill="#38BDF8" font-style="italic">i</tspan>c</text>
</svg>
